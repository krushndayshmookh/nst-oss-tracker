<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NST Open Source admin</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0b5d4d" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12201c" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b5d4d'/%3E%3Cpath d='M9 9v14M9 16c8 0 14-1 14-7' fill='none' stroke='%23f2b632' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='9' cy='8' r='3' fill='%23f2b632'/%3E%3Ccircle cx='9' cy='24' r='3' fill='%23f2b632'/%3E%3Ccircle cx='23' cy='8' r='3' fill='%23f2b632'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    /* Admin-only additions (tokens come from app.css). */
    .is-admin .page-head .toolbar { flex: 0 1 auto; max-width: 100%; }

    /* Students: "Missing data" chip group */
    .missing-bar { display: flex; flex-direction: column; gap: var(--s-2); padding: var(--s-3) var(--s-3); border: 1px dashed var(--rule-strong); border-radius: var(--radius); }
    .missing-head { display: flex; flex-wrap: wrap; gap: 2px var(--s-3); align-items: baseline; font-size: var(--fs-data); }
    .missing-bar .btn .count { font-variant-numeric: tabular-nums; font-weight: 650; }
    .btn.btn-quiet { background: none; border-color: transparent; text-decoration: underline; }

    /* Students: table with editable cells */
    .edit-table table.data td { white-space: normal; overflow: visible; max-width: none; vertical-align: top; padding-top: 8px; padding-bottom: 8px; }
    .edit-table .cell-stack { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .edit-table td input[type="text"], .edit-table td select { min-height: 30px; padding-top: 3px; padding-bottom: 3px; }
    .edit-table td.col-student { min-width: 220px; width: 26%; }
    .edit-table td.col-cohort { min-width: 124px; width: 11%; }
    .edit-table td.col-contact { min-width: 210px; width: 24%; }
    .edit-table table.data td.col-backfill { white-space: nowrap; }
    .edit-table td.col-actions { width: 1%; }
    .edit-table .row-actions { display: grid; grid-template-columns: auto auto; gap: 4px; justify-content: start; }
    .edit-table .row-actions .btn { white-space: nowrap; }
    .edit-table .row-badges { display: flex; flex-wrap: wrap; gap: 4px; }
    .edit-table .is-missing:not(.is-dirty) { border-style: dashed; border-color: var(--warn, var(--accent)); background: color-mix(in srgb, var(--warn-soft, var(--surface-2)) 45%, var(--surface)); }
    .edit-table .is-dirty { border-color: var(--brand); box-shadow: inset 3px 0 0 var(--brand); }
    .edit-table td [aria-invalid="true"] { border-color: var(--danger); border-style: solid; box-shadow: inset 3px 0 0 var(--danger); }
    .edit-table tr.is-inactive td.col-student input, .edit-table tr.is-inactive td.col-os { color: var(--ink-3); }
    .row-msg { font-size: var(--fs-sm); color: var(--ink-3); min-height: 1.2em; max-width: 26ch; white-space: normal; }
    .row-msg-ok { color: var(--ok); font-weight: 600; }
    .row-msg-error { color: var(--danger); font-weight: 550; }

    /* Jobs: scheduled fetch panel */
    .sched-status { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: var(--s-3) var(--s-5); margin: 0; }
    .sched-status > div { min-width: 0; }
    .sched-status dt { font-size: var(--fs-sm); color: var(--ink-3); font-weight: 550; }
    .sched-status dd { margin: 2px 0 0; font-size: var(--fs-data); }
    .sched-status dd strong { font-size: var(--fs-md); }
    .sched-live .log { max-height: 168px; margin-top: var(--s-2); }
    .sched-live .progress { margin: var(--s-2) 0; height: 10px; }
    .sched-live .toolbar { margin-top: var(--s-2); }
    .sched-inline { display: flex; flex-wrap: wrap; gap: var(--s-2) var(--s-3); align-items: flex-end; }
    .sched-inline > .form-row { flex: 0 1 190px; }
    .sched-runs, .sched-settings { margin-top: var(--s-2); }
    .sched-settings > summary, .sched-runs > summary { cursor: pointer; font-weight: 600; font-size: var(--fs-data); margin-bottom: var(--s-2); }
    .is-admin input[type="time"] {
      appearance: none; width: 100%; min-height: 34px; padding: 5px 10px; border: 1px solid var(--rule-strong); border-radius: var(--radius);
      background: var(--surface); color: var(--ink); font: inherit; font-size: var(--fs-data); line-height: 1.3;
    }
    .is-admin input[type="time"]:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; border-color: var(--focus); }
    .is-admin input[type="time"][aria-invalid="true"] { border-color: var(--danger); }

    @media (max-width: 640px) {
      .is-admin .page-head .toolbar { flex: 1 1 100%; }
      /* Students table becomes one block per student: every field is reachable without sideways scrolling */
      .edit-table .table-wrap { overflow: visible; }
      .edit-table table.data, .edit-table table.data tbody, .edit-table table.data tr, .edit-table table.data td { display: block; width: auto; }
      .edit-table table.data thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      .edit-table table.data tr { padding: 10px 0; border-bottom: 1px solid var(--rule-strong); }
      .edit-table table.data tbody tr:last-child { border-bottom: 0; }
      .edit-table table.data td, .edit-table.card .table-sticky table.data td:first-child {
        position: static; max-width: none; min-width: 0; width: auto; border: 0; padding: 3px 12px; box-shadow: none; text-align: left; background: none;
      }
      .edit-table table.data tbody tr:hover > * { background: none; }
      .edit-table td.col-cohort .cell-stack { flex-direction: row; flex-wrap: wrap; align-items: center; }
      .edit-table td.col-cohort select { flex: 1 1 120px; width: auto; }
      .edit-table td.col-backfill > div { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
      .edit-table td.col-os::before { content: "Merged open-source PRs: "; color: var(--ink-3); font-size: var(--fs-sm); }
      .edit-table .row-actions { display: flex; flex-wrap: wrap; }
      .row-msg { max-width: none; }
      .is-admin input[type="time"] { min-height: 38px; font-size: 1rem; }
      .sched-inline > .form-row { flex: 1 1 140px; }
    }
  </style>
</head>
<body class="is-admin">
  <a class="skip-link" href="#app">Skip to content</a>

  <header class="masthead">
    <div class="masthead-inner">
      <a class="brand" href="#/" aria-label="NST Open Source admin, start page">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <path d="M8 8v16M8 16c9 0 16-1 16-8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="8" cy="7" r="3.5" fill="currentColor"/>
          <circle cx="8" cy="25" r="3.5" fill="currentColor"/>
          <circle cx="24" cy="7" r="3.5" fill="currentColor"/>
        </svg>
        <span class="brand-text">
          <span class="brand-name">NST Open Source</span>
          <span class="brand-sub">Newton School of Technology</span>
        </span>
        <span class="brand-tag">Admin</span>
      </a>
      <nav id="admin-nav" class="site-nav" aria-label="Admin" hidden>
        <a data-nav href="#/students">Students</a>
        <a data-nav href="#/review">Review</a>
        <a data-nav href="#/prs">Pull requests</a>
        <a data-nav href="#/overrides">Overrides</a>
        <a data-nav href="#/rules">Rules</a>
        <a data-nav href="#/jobs">Jobs</a>
        <span class="nav-end"><button type="button" class="btn btn-sm" id="admin-logout">Sign out</button></span>
      </nav>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <noscript><p>The admin area needs JavaScript.</p></noscript>
  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <span>Admin area. Changes here are visible on the public site straight away.</span>
      <span class="footer-end"><a href="/">View the public site</a></span>
    </div>
  </footer>

  <script type="module" src="/js/lib/shell.js"></script>
  <script type="module" src="/js/admin/main.js"></script>
</body>
</html>
