# Web app: public dashboard + admin area + in-process job runner.
# replicas must stay 1 (the job runner and the login rate limit live in the process), hence strategy Recreate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oss-status
  namespace: oss-status
  labels:
    app.kubernetes.io/name: oss-status
    app.kubernetes.io/part-of: oss-status
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: oss-status
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oss-status
        app.kubernetes.io/part-of: oss-status
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000       # `node` user of the image
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: registry.nstsdc.org:5000/oss-status   # tag is set in kustomization.yaml
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: oss-status-secrets   # ADMIN_PASSWORD, SESSION_SECRET, GITHUB_TOKEN
          env:
            - name: PORT
              value: "3000"
            - name: MONGODB_URI
              value: mongodb://mongo:27017
            - name: MONGODB_DB
              value: oss_status
            - name: NODE_ENV
              value: production
            - name: TRUST_PROXY
              value: "1"
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp   # scratch space, also the target of `kubectl cp data …:/tmp/data` for the first import
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: oss-status
  namespace: oss-status
  labels:
    app.kubernetes.io/name: oss-status
    app.kubernetes.io/part-of: oss-status
spec:
  selector:
    app.kubernetes.io/name: oss-status
  ports:
    - name: http
      port: 80
      targetPort: http
