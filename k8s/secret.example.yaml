# EXAMPLE, never applied and not part of kustomization.yaml: it only documents the keys of the Secret.
# Create the real Secret from the command line so that no secret is ever written to a file in the repo:
#
#   kubectl -n oss-status create secret generic oss-status-secrets \
#     --from-literal=ADMIN_PASSWORD='<password for /admin>' \
#     --from-literal=SESSION_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=GITHUB_TOKEN='<github token, public read only>'
#
apiVersion: v1
kind: Secret
metadata:
  name: oss-status-secrets
  namespace: oss-status
type: Opaque
stringData:
  ADMIN_PASSWORD: "CHANGE-ME"     # password of the admin area; admin API answers 503 while it is empty
  SESSION_SECRET: "CHANGE-ME"     # signs the admin cookie; openssl rand -hex 32
  GITHUB_TOKEN: "CHANGE-ME"       # used by the daily sync, backfills and "add student" validation
