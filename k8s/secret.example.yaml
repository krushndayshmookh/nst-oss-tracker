# EXAMPLE, never applied and not part of kustomization.yaml: it only documents the keys of the two Secrets.
# Create the real Secrets from the command line so that no secret is ever written to a file in the repo:
#
#   MONGO_APP_PASSWORD="$(openssl rand -hex 24)"      # hex: safe inside a connection string
#   kubectl -n oss-status create secret generic oss-status-mongo \
#     --from-literal=MONGO_ROOT_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=MONGO_APP_PASSWORD="$MONGO_APP_PASSWORD"
#   kubectl -n oss-status create secret generic oss-status-secrets \
#     --from-literal=ADMIN_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=OWNER_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=SESSION_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=GITHUB_TOKEN='<github token, public read only>' \
#     --from-literal=MONGODB_URI="mongodb://oss_status:${MONGO_APP_PASSWORD}@mongo:27017/oss_status?authSource=oss_status"
#
# In production the admin area stays closed (HTTP 503) while ADMIN_PASSWORD is shorter than 16 characters,
# SESSION_SECRET is shorter than 32, or either still holds a placeholder such as CHANGE-ME.
# Changing ADMIN_PASSWORD (and restarting the app) signs every admin out.
# OWNER_PASSWORD is the second password of the private page "Krushn's dashboard": known to its owner only, at least
# 16 characters, different from ADMIN_PASSWORD. While it is missing or weak that page answers 503; everything else works.
# To add it to an existing Secret:
#   kubectl -n oss-status patch secret oss-status-secrets --type merge \
#     -p "{\"stringData\":{\"OWNER_PASSWORD\":\"$(openssl rand -base64 24)\"}}" && kubectl -n oss-status rollout restart deploy/oss-status
apiVersion: v1
kind: Secret
metadata:
  name: oss-status-mongo            # used by the mongo pod only
  namespace: oss-status
type: Opaque
stringData:
  MONGO_ROOT_PASSWORD: "CHANGE-ME"  # MongoDB user `root` (maintenance only); openssl rand -hex 24
  MONGO_APP_PASSWORD: "CHANGE-ME"   # MongoDB user `oss_status` (readWrite on oss_status); openssl rand -hex 24
---
apiVersion: v1
kind: Secret
metadata:
  name: oss-status-secrets          # envFrom of the app
  namespace: oss-status
type: Opaque
stringData:
  ADMIN_PASSWORD: "CHANGE-ME"       # password of the admin area: long and random, at least 16 characters
  OWNER_PASSWORD: "CHANGE-ME"       # second password of the private page (one person only): long and random recommended, not the admin password
  SESSION_SECRET: "CHANGE-ME"       # signs the admin cookie; openssl rand -hex 32 (at least 32 characters)
  GITHUB_TOKEN: "CHANGE-ME"         # used by the nightly fetch, backfills and "add student" validation
  MONGODB_URI: "mongodb://oss_status:CHANGE-ME@mongo:27017/oss_status?authSource=oss_status"
